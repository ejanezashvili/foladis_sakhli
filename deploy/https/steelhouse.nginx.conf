# nginx in front of Odoo (8.7 / 4.7: HTTPS -> phone "install as app" + push notifications).
# Install as /etc/nginx/sites-available/steelhouse (+ link in sites-enabled), replace DOMAIN with the
# company's name (e.g. tasks.poladissakhli.ge). Certificates: certbot --nginx -d DOMAIN (see README.md).
# Odoo runs threaded (no "workers" in odoo.conf), so the live chat / notifications websocket is on 8069 too.

upstream odoo {
    server 127.0.0.1:8069;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name DOMAIN;
    # certbot answers its check here, everything else goes to https
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64m;          # attachments, photos from the phone camera
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location /websocket {
        proxy_pass http://odoo;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
    }

    gzip on;
    gzip_types text/css text/plain application/json application/javascript image/svg+xml;
}
